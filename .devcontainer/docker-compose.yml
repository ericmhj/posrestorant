version: '3.9'

# Load environment variables from .env file
# Copy .env.example to .env before starting: cp .devcontainer/.env.example .devcontainer/.env

networks:
  pos-network:
    driver: bridge

volumes:
  postgres-data:
  maven-cache:
  node-modules:

services:
  db:
    image: postgres:15-alpine
    container_name: pos-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pos_db}
      POSTGRES_USER: ${POSTGRES_USER:-pos_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pos_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - pos-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pos_user} -d ${POSTGRES_DB:-pos_db}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ../pos-backend
      dockerfile: Dockerfile.dev
    container_name: pos-backend
    env_file:
      - .env
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: ${QUARKUS_DATASOURCE_JDBC_URL:-jdbc:postgresql://db:5432/pos_db}
      QUARKUS_DATASOURCE_USERNAME: ${QUARKUS_DATASOURCE_USERNAME:-pos_user}
      QUARKUS_DATASOURCE_PASSWORD: ${QUARKUS_DATASOURCE_PASSWORD:-pos_password}
      QUARKUS_LOG_LEVEL: ${QUARKUS_LOG_LEVEL:-ERROR}
    ports:
      - "8080:8080"
      - "5005:5005"
    volumes:
      - ../pos-backend:/workspace/pos-backend
      - ../pos-frontend:/workspace/pos-frontend
      - maven-cache:/root/.m2/repository
    networks:
      - pos-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/q/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ../pos-frontend
      dockerfile: Dockerfile.dev
    container_name: pos-frontend
    env_file:
      - .env
    environment:
      NODE_ENV: development
      API_URL: ${API_URL:-http://backend:8080}
    ports:
      - "4200:4200"
    volumes:
      - ../pos-frontend:/workspace/pos-frontend
      - node-modules:/workspace/pos-frontend/node_modules
    networks:
      - pos-network
    depends_on:
      - backend
