# =============================================================================
# POS Restaurant System — Development Profile Overrides
# Active when: quarkus.profile=dev (default for quarkus:dev)
# =============================================================================

# Verbose logging in dev
quarkus.log.level=DEBUG
quarkus.log.console.json=false

# Always show Swagger UI in dev
quarkus.swagger-ui.always-include=true

# Hibernate: show SQL in dev
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.bind-parameters=true

# Flyway: clean on migrate in dev (NEVER enable in prod)
# quarkus.flyway.clean-at-start=true
