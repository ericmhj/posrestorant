# =============================================================================
# POS Restaurant System — Quarkus Application Properties
# =============================================================================

# ---------------------------------------------------------------------------
# Datasource (values injected from environment variables)
# ---------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/pos_db}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:pos_user}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:pos_password}

# ---------------------------------------------------------------------------
# Hibernate ORM
# ---------------------------------------------------------------------------
quarkus.hibernate-orm.database.generation=none

# ---------------------------------------------------------------------------
# Flyway
# ---------------------------------------------------------------------------
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------------------
# HTTP
# ---------------------------------------------------------------------------
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:4200}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,Accept
quarkus.http.cors.exposed-headers=Content-Disposition

# GZIP compression
quarkus.http.enable-compression=true
quarkus.http.compress-media-types=application/json,text/plain,text/html

# ---------------------------------------------------------------------------
# OpenAPI / Swagger UI
# ---------------------------------------------------------------------------
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.swagger-ui.always-include=true

# ---------------------------------------------------------------------------
# Health
# ---------------------------------------------------------------------------
quarkus.smallrye-health.root-path=/q/health

# ---------------------------------------------------------------------------
# Metrics (Prometheus)
# ---------------------------------------------------------------------------
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics

# ---------------------------------------------------------------------------
# Logging (structured JSON)
# ---------------------------------------------------------------------------
quarkus.log.level=${QUARKUS_LOG_LEVEL:INFO}
quarkus.log.console.json=true
quarkus.log.console.json.fields.timestamp.field-name=timestamp
quarkus.log.console.json.fields.level.field-name=level
quarkus.log.console.json.fields.logger-name.field-name=logger
quarkus.log.console.json.fields.message.field-name=message

# ---------------------------------------------------------------------------
# Static file serving (product images)
# ---------------------------------------------------------------------------
quarkus.http.root-path=/
quarkus.http.static-resources.uploads.path=/uploads
quarkus.http.static-resources.uploads.location=/workspace/uploads

# ---------------------------------------------------------------------------
# Logging MDC fields (traceId propagation in JSON logs)
# ---------------------------------------------------------------------------
quarkus.log.console.json.additional-field.traceId.value=${traceId:}
quarkus.log.console.json.additional-field.spanId.value=${spanId:}

# ---------------------------------------------------------------------------
# Application info
# ---------------------------------------------------------------------------
quarkus.application.name=pos-backend
quarkus.application.version=1.0.0-SNAPSHOT

# ---------------------------------------------------------------------------
# Image uploads directory
# ---------------------------------------------------------------------------
pos.uploads.dir=/workspace/uploads/productos
pos.jwt.expiration-hours=8
