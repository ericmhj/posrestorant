# Test configuration — uses H2 in-memory database
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:pos_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
quarkus.datasource.username=sa
quarkus.datasource.password=

quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.flyway.migrate-at-start=false

quarkus.log.level=WARN
quarkus.log.console.json=false

# Disable Prometheus in tests
quarkus.micrometer.export.prometheus.enabled=false

# Uploads dir for tests
pos.uploads.dir=target/test-uploads/productos
